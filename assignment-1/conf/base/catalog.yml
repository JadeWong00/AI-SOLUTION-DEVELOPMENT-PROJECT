raw_sql_data:
  type: kedro_datasets.pandas.sql_dataset.SQLTableDataset
  table_name: bank_marketing
  credentials: bmarket_db

one_hot_encoded_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/one_hot_encoded_data.parquet
  save_args:
    index: False

label_encoded_dataset:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/label_encoded_dataset.parquet
  save_args:
    index: False

forest:
  type: pickle.PickleDataset
  filepath: ../saved_models/forest.pickle
  versioned: true

knn_model:
  type: pickle.PickleDataset
  filepath: ../saved_models/knn_model.pickle
  versioned: true

xgb_model:
  type: pickle.PickleDataset
  filepath: ../saved_models/xgb_model.pickle
  versioned: true

catboost_model:
  type: pickle.PickleDataset
  filepath: ../saved_models/catboost_model.pickle
  versioned: true